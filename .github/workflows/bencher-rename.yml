# One-off (2026-08-16): carry Bencher series history across the four-class benchmark
# taxonomy rename ({Materialize, Memoize} x {construction, replay} -- see
# design-docs/CHANGELOG_BENCHMARKS.md). Renames the 8 affected benchmarks IN PLACE so
# their per-testbed histories and thresholds survive; the gh-pages history gets the same
# mapping by data-surgery commit. Dispatch manually BEFORE the first benchmark run under
# the new names (a run first would mint fresh series and orphan the histories). Safe to
# re-run: an already-renamed benchmark just no-ops (search misses the old name). Delete
# this workflow after the rename is verified.
name: Bencher Series Rename (one-off)

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename the eight series
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          set -euo pipefail
          PROJECT="copse-dotnet"
          rename() {
            OLD="$1"; NEW="$2"
            UUID=$(curl -s "https://api.bencher.dev/v0/projects/$PROJECT/benchmarks?search=$(echo "$OLD" | sed 's/ /%20/g')&per_page=25" \
              | jq -r --arg n "$OLD" '.[] | select(.name==$n) | .uuid')
            if [ -z "$UUID" ]; then
              echo "SKIP (not found -- already renamed?): $OLD"
              return 0
            fi
            SLUG=$(echo "$NEW" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9\n' '-' | tr -s '-' | sed 's/^-//; s/-$//')
            curl -sf -X PATCH "https://api.bencher.dev/v0/projects/$PROJECT/benchmarks/$UUID" \
              -H "Authorization: Bearer $BENCHER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"$NEW\", \"slug\": \"$SLUG\"}" > /dev/null
            echo "RENAMED: $OLD -> $NEW"
          }
          rename "Copse.Benchmarks.Materialize.DftCapture_Triangle"      "Copse.Benchmarks.Materialize.Preorder_Triangle"
          rename "Copse.Benchmarks.Materialize.DftCapture_Chain"        "Copse.Benchmarks.Materialize.Preorder_Chain"
          rename "Copse.Benchmarks.Materialize.BftCapture_Triangle"     "Copse.Benchmarks.Materialize.LevelOrder_Triangle"
          rename "Copse.Benchmarks.Materialize.BftCapture_Chain"        "Copse.Benchmarks.Materialize.LevelOrder_Chain"
          rename "Copse.Benchmarks.Memoize.Replay_Dft_over_DftCapture"  "Copse.Benchmarks.MaterializeReplay.Dft_over_Preorder"
          rename "Copse.Benchmarks.Memoize.Replay_Bft_over_DftCapture"  "Copse.Benchmarks.MaterializeReplay.Bft_over_Preorder"
          rename "Copse.Benchmarks.Memoize.Replay_Bft_over_BftCapture"  "Copse.Benchmarks.MaterializeReplay.Bft_over_LevelOrder"
          rename "Copse.Benchmarks.Memoize.Replay_Dft_over_BftCapture"  "Copse.Benchmarks.MaterializeReplay.Dft_over_LevelOrder"
